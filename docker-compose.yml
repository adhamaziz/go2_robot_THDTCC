services:
  go2_humble:
    build:
      context: .
      dockerfile: Dockerfile
    image: go2_humble:latest
    container_name: go2_humble_container
    network_mode: "host"
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - ROS_DOMAIN_ID=1
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_SOFTWARE=1
      - CYCLONEDDS_URI=/ros2_ws/cyclonedds.xml
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - .:/ros2_ws
    devices:
      - /dev/dri:/dev/dri
    stdin_open: true
    tty: true
    command: /bin/bash