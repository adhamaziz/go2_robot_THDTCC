amcl:
  ros__parameters:
    use_sim_time: False
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_link"
    global_frame_id: "map"
    odom_frame_id: "odom"
    scan_topic: "scan"
    map_topic: "map"

    # --- Match Pointcloud-to-Laserscan Node Settings ---
    laser_min_range: 0.20            # CHANGED: Match range_min to exclude robot body reflections
    laser_max_range: 30.0            # CHANGED: Match range_max of the Go2 lidar
    max_beams: 180                   # CHANGED: 60 is too sparse for Go2 4D slice; 180 yields better convergence
    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 2.0

    # --- Initial Pose Auto-Start ---
    set_initial_pose: true           # CHANGED: Stops AMCL from blocking on startup
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

    # --- Particles & Tolerances ---
    min_particles: 500
    max_particles: 2000
    robot_model_type: "omnidirectional"  # Explicit plugin name for ROS 2 Humble/Iron
    tf_broadcast: true
    transform_tolerance: 0.5         # CHANGED: 2.0s is unnecessarily high and hides time-sync drops
    update_min_a: 0.1                # CHANGED: Lower angle threshold so AMCL updates during small turns
    update_min_d: 0.1                # CHANGED: Lower distance threshold for faster convergence
    
    # --- Sensor Model Weights (Must sum roughly to 1.0) ---
    z_hit: 0.8                       # CHANGED: Trust genuine hits more
    z_rand: 0.1                      # CHANGED: Lower random noise
    z_short: 0.05
    z_max: 0.05
    sigma_hit: 0.1

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: "/home/unitree/may4.yaml"

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True